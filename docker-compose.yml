
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo

    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  api:
    image: python:3.13
    container_name: fastapi
    restart: always
    env_file:
      - .env
    environment:
      # Dockerのネットワーク経由でMySQLに繋ぐためにホスト名を上書き
      - MYSQL_HOST=mysql
      - TZ=Asia/Tokyo
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn from_discord:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - TZ=Asia/Tokyo
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data: