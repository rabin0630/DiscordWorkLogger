<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence Diagram</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1e1e1e;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    padding: 40px;
  }
  .sequence-diagram {
    display: flex;
    flex-direction: column;
    position: relative;
    width: 800px;
    margin-top: 20px;
  }
  .actors {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .actor {
    background: #4caf50;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
    width: 120px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .actor.bot { background: #2196f3; }
  .actor.gemini { background: #ff9800; }
  .actor.voicevox { background: #e91e63; }
  
  .lifelines {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    z-index: 0;
  }
  .lifeline {
    width: 2px;
    background: repeating-linear-gradient(to bottom, #555 0, #555 10px, transparent 10px, transparent 20px);
    margin: 0 80px;
    position: relative;
  }
  
  .messages {
    display: flex;
    flex-direction: column;
    gap: 30px;
    position: relative;
    z-index: 1;
    margin-top: 10px;
  }
  .message {
    position: relative;
    height: 30px;
    display: flex;
    align-items: center;
  }
  .arrow {
    position: absolute;
    height: 2px;
    background-color: #e0e0e0;
  }
  .arrow::after {
    content: '';
    position: absolute;
    top: -4px;
    border-style: solid;
    border-width: 5px;
  }
  /* Right arrow */
  .arrow.right::after {
    right: -2px;
    border-color: transparent transparent transparent #e0e0e0;
  }
  /* Left arrow */
  .arrow.left::after {
    left: -2px;
    border-color: transparent #e0e0e0 transparent transparent;
  }
  .msg-text {
    position: absolute;
    top: -20px;
    width: 100%;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="sequence-diagram">
  <div class="actors">
    <div class="actor">User</div>
    <div class="actor bot">Discord Bot</div>
    <div class="actor gemini">Gemini API</div>
    <div class="actor voicevox">Voicevox API</div>
  </div>
  
  <div class="lifelines">
    <div class="lifeline" style="left: 10%;"></div>
    <div class="lifeline" style="left: 36.5%;"></div>
    <div class="lifeline" style="left: 63%;"></div>
    <div class="lifeline" style="left: 90%;"></div>
  </div>

  <div class="messages">
    <!-- User to Bot -->
    <div class="message">
      <div class="arrow right" style="left: 10%; width: 26.5%;">
        <div class="msg-text">1. /chat_zundamon (プロンプト)</div>
      </div>
    </div>
    
    <!-- Bot to User (Defer) -->
    <div class="message">
      <div class="arrow left" style="left: 10%; width: 26.5%; border-top: 2px dashed #e0e0e0; background: transparent;">
        <div class="msg-text" style="top: -25px;">2. defer() (考え中...)</div>
      </div>
    </div>

    <!-- Bot to Gemini -->
    <div class="message">
      <div class="arrow right" style="left: 36.5%; width: 26.5%;">
        <div class="msg-text">3. プロンプト + gemini.md 送信</div>
      </div>
    </div>

    <!-- Gemini to Bot -->
    <div class="message">
      <div class="arrow left" style="left: 36.5%; width: 26.5%; border-top: 2px dashed #e0e0e0; background: transparent;">
        <div class="msg-text" style="top: -25px;">4. 回答テキストを返す</div>
      </div>
    </div>

    <!-- Bot to Voicevox -->
    <div class="message">
      <div class="arrow right" style="left: 36.5%; width: 53.5%;">
        <div class="msg-text">5. 回答テキスト送信</div>
      </div>
    </div>

    <!-- Voicevox to Bot -->
    <div class="message">
      <div class="arrow left" style="left: 36.5%; width: 53.5%; border-top: 2px dashed #e0e0e0; background: transparent;">
        <div class="msg-text" style="top: -25px;">6. 音声データ(.wav)を返す</div>
      </div>
    </div>

    <!-- Bot to User -->
    <div class="message">
      <div class="arrow left" style="left: 10%; width: 26.5%;">
        <div class="msg-text">7. 音声再生 ＆ テキスト送信</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
